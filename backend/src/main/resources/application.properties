# ===================================================================
# Spring Boot Configuration - Online Banking Management System
# ===================================================================

spring.application.name=online-banking-management-system

# Server Port
server.port=${PORT:8080}

# ===================================================================
# MySQL Database Configuration
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/online_banking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# JWT Security Configuration
# 256-bit secret key for HMAC-SHA256 signing
# ===================================================================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 24 hours expiration (in milliseconds)
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# Banking Defaults
# ===================================================================
banking.account.initial-balance=5000.00
