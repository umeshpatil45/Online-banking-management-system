<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Online Banking Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="navbar-container"></div>

  <div class="container my-auto py-4">
    <div class="auth-container">
      <div id="register-alert" class="alert-feedback mb-3"></div>

      <div class="banking-card shadow-sm">
        <div class="banking-card-header bg-primary text-white py-3">
          <h4 class="mb-0 fw-bold"><i class="bi bi-person-plus-fill me-2"></i> Open a Bank Account</h4>
        </div>
        <div class="banking-card-body p-4">
          <form id="register-form">
            <div class="mb-3">
              <label for="reg-fullname" class="form-label fw-semibold">Full Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="reg-fullname" placeholder="e.g. Umesh Patil" required minlength="2">
              </div>
            </div>

            <div class="mb-3">
              <label for="reg-email" class="form-label fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="reg-email" placeholder="name@example.com" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="reg-mobile" class="form-label fw-semibold">Mobile Number</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-phone"></i></span>
                <input type="tel" class="form-control" id="reg-mobile" placeholder="10-digit number" pattern="[0-9]{10}" required>
              </div>
              <small class="text-muted">Must be exactly 10 digits.</small>
            </div>

            <div class="mb-3">
              <label for="reg-account-type" class="form-label fw-semibold">Account Type</label>
              <select class="form-select" id="reg-account-type">
                <option value="SAVINGS" selected>Savings Account (Standard)</option>
                <option value="CURRENT">Current Account (Commercial)</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="reg-password" class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                <input type="password" class="form-control" id="reg-password" placeholder="Min 6 characters" required minlength="6">
              </div>
            </div>

            <div class="mb-4">
              <label for="reg-confirm-password" class="form-label fw-semibold">Confirm Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-shield-check"></i></span>
                <input type="password" class="form-control" id="reg-confirm-password" placeholder="Repeat password" required>
              </div>
            </div>

            <button type="submit" id="register-submit-btn" class="btn btn-primary w-100 py-2 fw-semibold">
              <i class="bi bi-check2-circle me-1"></i> Register & Create Account
            </button>
          </form>
        </div>
        <div class="banking-card-header bg-light text-center py-3">
          <p class="small text-muted mb-0">Already have an account? <a href="login.html" class="text-primary fw-bold">Login here</a></p>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div class="container text-center">
      <p class="mb-0 text-muted small">Online Banking System &bull; Secure Simulation &bull; Umesh Patil</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      Auth.redirectIfLoggedIn();
      renderNavbar("register");

      document.getElementById("register-form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const fullName = document.getElementById("reg-fullname").value.trim();
        const email = document.getElementById("reg-email").value.trim();
        const mobile = document.getElementById("reg-mobile").value.trim();
        const accountType = document.getElementById("reg-account-type").value;
        const password = document.getElementById("reg-password").value;
        const confirmPassword = document.getElementById("reg-confirm-password").value;

        if (password !== confirmPassword) {
          showAlert("register-alert", "Passwords do not match.", "danger");
          return;
        }

        const submitBtn = document.getElementById("register-submit-btn");
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Processing...`;

        try {
          const res = await apiFetch("/auth/register", {
            method: "POST",
            body: JSON.stringify({
              fullName,
              email,
              mobile,
              accountType,
              password,
              confirmPassword
            })
          });

          if (res.success && res.data) {
            Auth.setAuthData(res.data);
            window.location.href = "dashboard.html?msg=welcome";
          }
        } catch (err) {
          showAlert("register-alert", err.message, "danger");
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<i class="bi bi-check2-circle me-1"></i> Register & Create Account`;
        }
      });
    });
  </script>
</body>
</html>
