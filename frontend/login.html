<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Online Banking Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="navbar-container"></div>

  <div class="container my-auto">
    <div class="auth-container">
      <!-- Alerts -->
      <div id="login-alert" class="alert-feedback mb-3"></div>

      <div class="banking-card shadow-sm">
        <div class="banking-card-header bg-primary text-white py-3">
          <h4 class="mb-0 fw-bold"><i class="bi bi-shield-lock-fill me-2"></i> Account Sign In</h4>
        </div>
        <div class="banking-card-body p-4">
          <form id="login-form">
            <div class="mb-3">
              <label for="login-email" class="form-label fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="login-email" placeholder="name@example.com" required>
              </div>
            </div>

            <div class="mb-4">
              <label for="login-password" class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                <input type="password" class="form-control" id="login-password" placeholder="••••••••" required>
                <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('login-password')">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <button type="submit" id="login-submit-btn" class="btn btn-primary w-100 py-2 fw-semibold">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
          </form>

          <!-- Demo Accounts Helper -->
          <div class="mt-4 pt-3 border-top text-center">
            <p class="small text-muted mb-2 fw-semibold">Quick Demo Login Credentials:</p>
            <div class="d-flex gap-2 justify-content-center">
              <button class="btn btn-outline-primary btn-sm" onclick="fillDemo('umesh@bank.com', 'User@123')">
                <i class="bi bi-person me-1"></i> User Demo
              </button>
              <button class="btn btn-outline-secondary btn-sm" onclick="fillDemo('admin@bank.com', 'Admin@123')">
                <i class="bi bi-shield-check me-1"></i> Admin Demo
              </button>
            </div>
          </div>
        </div>
        <div class="banking-card-header bg-light text-center py-3">
          <p class="small text-muted mb-0">Don't have an account? <a href="register.html" class="text-primary fw-bold">Register here</a></p>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div class="container text-center">
      <p class="mb-0 text-muted small">Online Banking System &bull; Secure Simulation &bull; Umesh Patil</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      Auth.redirectIfLoggedIn();
      renderNavbar("login");

      const params = new URLSearchParams(window.location.search);
      if (params.get("msg") === "expired") {
        showAlert("login-alert", "Your session has expired. Please login again.", "warning");
      } else if (params.get("msg") === "unauthorized") {
        showAlert("login-alert", "Please login to continue.", "info");
      } else if (params.get("msg") === "logout") {
        showAlert("login-alert", "You have been logged out successfully.", "success");
      }

      document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("login-email").value.trim();
        const password = document.getElementById("login-password").value;
        const submitBtn = document.getElementById("login-submit-btn");

        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Authenticating...`;

        try {
          const res = await apiFetch("/auth/login", {
            method: "POST",
            body: JSON.stringify({ email, password })
          });

          if (res.success && res.data) {
            Auth.setAuthData(res.data);
            if (Auth.isAdmin()) {
              window.location.href = "admin.html";
            } else {
              window.location.href = "dashboard.html";
            }
          }
        } catch (err) {
          showAlert("login-alert", err.message || "Invalid email or password.", "danger");
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<i class="bi bi-box-arrow-in-right me-1"></i> Sign In`;
        }
      });
    });

    function fillDemo(email, pass) {
      document.getElementById("login-email").value = email;
      document.getElementById("login-password").value = pass;
    }

    function togglePasswordVisibility(fieldId) {
      const field = document.getElementById(fieldId);
      if (field.type === "password") {
        field.type = "text";
      } else {
        field.type = "password";
      }
    }
  </script>
</body>
</html>
