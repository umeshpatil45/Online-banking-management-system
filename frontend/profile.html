<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - Online Banking Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="navbar-container"></div>

  <div class="container py-4">
    <div id="profile-alert" class="alert-feedback mb-3"></div>

    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
      <div>
        <h2 class="fw-bold mb-1"><i class="bi bi-person-gear text-primary me-2"></i> Profile & Security</h2>
        <p class="text-muted mb-0">Update your personal information and manage account security credentials.</p>
      </div>
      <a href="dashboard.html" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
      </a>
    </div>

    <div class="row g-4">
      <!-- Personal Info Card -->
      <div class="col-lg-6">
        <div class="banking-card shadow-sm h-100">
          <div class="banking-card-header bg-light py-3">
            <h5 class="fw-bold mb-0"><i class="bi bi-person-lines-fill me-2 text-primary"></i> Personal Details</h5>
          </div>
          <div class="banking-card-body p-4">
            <form id="profile-form">
              <div class="mb-3">
                <label for="profile-name" class="form-label fw-semibold">Full Name</label>
                <input type="text" class="form-control" id="profile-name" required>
              </div>

              <div class="mb-3">
                <label for="profile-email" class="form-label fw-semibold">Email Address (Read-only)</label>
                <input type="email" class="form-control bg-light" id="profile-email" readonly disabled>
                <small class="text-muted">Primary account identifier cannot be modified.</small>
              </div>

              <div class="mb-3">
                <label for="profile-mobile" class="form-label fw-semibold">Mobile Number</label>
                <input type="tel" class="form-control" id="profile-mobile" pattern="[0-9]{10}" required>
              </div>

              <div class="mb-4">
                <label class="form-label fw-semibold">Associated Account Number</label>
                <input type="text" class="form-control font-monospace bg-light" id="profile-acc-num" readonly disabled>
              </div>

              <button type="submit" id="profile-save-btn" class="btn btn-primary fw-semibold">
                <i class="bi bi-save me-1"></i> Save Changes
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- Change Password Card -->
      <div class="col-lg-6">
        <div class="banking-card shadow-sm h-100">
          <div class="banking-card-header bg-light py-3">
            <h5 class="fw-bold mb-0"><i class="bi bi-key-fill me-2 text-primary"></i> Change Password</h5>
          </div>
          <div class="banking-card-body p-4">
            <form id="password-form">
              <div class="mb-3">
                <label for="pwd-old" class="form-label fw-semibold">Current Password</label>
                <input type="password" class="form-control" id="pwd-old" placeholder="Enter current password" required>
              </div>

              <div class="mb-3">
                <label for="pwd-new" class="form-label fw-semibold">New Password</label>
                <input type="password" class="form-control" id="pwd-new" placeholder="Min 6 characters" minlength="6" required>
              </div>

              <div class="mb-4">
                <label for="pwd-confirm" class="form-label fw-semibold">Confirm New Password</label>
                <input type="password" class="form-control" id="pwd-confirm" placeholder="Repeat new password" required>
              </div>

              <button type="submit" id="pwd-save-btn" class="btn btn-outline-danger fw-semibold">
                <i class="bi bi-shield-lock me-1"></i> Update Password
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div class="container text-center">
      <p class="mb-0 text-muted small">Online Banking System &bull; Secure Simulation &bull; Umesh Patil</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      Auth.requireAuth();
      renderNavbar("profile");

      await loadProfile();

      // Profile update listener
      document.getElementById("profile-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fullName = document.getElementById("profile-name").value.trim();
        const mobile = document.getElementById("profile-mobile").value.trim();
        const btn = document.getElementById("profile-save-btn");

        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Saving...`;

        try {
          const res = await apiFetch("/users/me", {
            method: "PUT",
            body: JSON.stringify({ fullName, mobile })
          });

          if (res.success && res.data) {
            showAlert("profile-alert", "Profile updated successfully.", "success");
            // Update cached user info
            const user = Auth.getUser();
            if (user) {
              user.fullName = res.data.fullName;
              localStorage.setItem("bank_user_info", JSON.stringify(user));
              renderNavbar("profile");
            }
          }
        } catch (err) {
          showAlert("profile-alert", err.message, "danger");
        } finally {
          btn.disabled = false;
          btn.innerHTML = `<i class="bi bi-save me-1"></i> Save Changes`;
        }
      });

      // Password update listener
      document.getElementById("password-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const oldPassword = document.getElementById("pwd-old").value;
        const newPassword = document.getElementById("pwd-new").value;
        const confirmPassword = document.getElementById("pwd-confirm").value;

        if (newPassword !== confirmPassword) {
          showAlert("profile-alert", "New passwords do not match.", "danger");
          return;
        }

        const btn = document.getElementById("pwd-save-btn");
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Updating...`;

        try {
          const res = await apiFetch("/users/me/password", {
            method: "PUT",
            body: JSON.stringify({ oldPassword, newPassword, confirmPassword })
          });

          if (res.success) {
            showAlert("profile-alert", "Password changed successfully.", "success");
            document.getElementById("password-form").reset();
          }
        } catch (err) {
          showAlert("profile-alert", err.message, "danger");
        } finally {
          btn.disabled = false;
          btn.innerHTML = `<i class="bi bi-shield-lock me-1"></i> Update Password`;
        }
      });
    });

    async function loadProfile() {
      try {
        const res = await apiFetch("/users/me");
        if (res.success && res.data) {
          document.getElementById("profile-name").value = res.data.fullName;
          document.getElementById("profile-email").value = res.data.email;
          document.getElementById("profile-mobile").value = res.data.mobile;
          document.getElementById("profile-acc-num").value = res.data.accountNumber || "N/A";
        }
      } catch (err) {
        showAlert("profile-alert", err.message, "danger");
      }
    }
  </script>
</body>
</html>
