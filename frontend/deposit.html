<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deposit Funds - Online Banking Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="navbar-container"></div>

  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div id="deposit-alert" class="alert-feedback mb-3"></div>

        <div class="banking-card shadow-sm">
          <div class="banking-card-header bg-success text-white py-3">
            <h4 class="mb-0 fw-bold"><i class="bi bi-plus-circle-fill me-2"></i> Deposit Money</h4>
          </div>
          <div class="banking-card-body p-4">
            <!-- Account Info Summary -->
            <div class="bg-light p-3 rounded-3 mb-4 d-flex justify-content-between align-items-center">
              <div>
                <small class="text-muted d-block">Target Account</small>
                <span id="deposit-acc-num" class="fw-bold font-monospace">Loading...</span>
              </div>
              <div class="text-end">
                <small class="text-muted d-block">Current Balance</small>
                <span id="deposit-current-balance" class="fw-bold text-success fs-5">₹ 0.00</span>
              </div>
            </div>

            <form id="deposit-form">
              <div class="mb-3">
                <label for="deposit-amount" class="form-label fw-semibold">Deposit Amount (₹)</label>
                <div class="input-group input-group-lg">
                  <span class="input-group-text bg-white fw-bold">₹</span>
                  <input type="number" class="form-control fw-bold" id="deposit-amount" placeholder="0.00" min="1" step="0.01" required>
                </div>
              </div>

              <!-- Quick Amount Buttons -->
              <div class="mb-3">
                <small class="text-muted d-block mb-2 fw-semibold">Quick Amounts:</small>
                <div class="d-flex flex-wrap gap-2">
                  <button type="button" class="quick-amount-btn" onclick="setDepositAmount(500)">+ ₹500</button>
                  <button type="button" class="quick-amount-btn" onclick="setDepositAmount(1000)">+ ₹1,000</button>
                  <button type="button" class="quick-amount-btn" onclick="setDepositAmount(5000)">+ ₹5,000</button>
                  <button type="button" class="quick-amount-btn" onclick="setDepositAmount(10000)">+ ₹10,000</button>
                </div>
              </div>

              <div class="mb-4">
                <label for="deposit-desc" class="form-label fw-semibold">Description / Remarks (Optional)</label>
                <input type="text" class="form-control" id="deposit-desc" placeholder="e.g. Salary deposit, Savings">
              </div>

              <button type="submit" id="btn-deposit-submit" class="btn btn-success btn-lg w-100 fw-semibold">
                <i class="bi bi-check-circle me-1"></i> Confirm & Process Deposit
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div class="container text-center">
      <p class="mb-0 text-muted small">Online Banking System &bull; Secure Simulation &bull; Umesh Patil</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      Auth.requireAuth();
      renderNavbar("dashboard");

      await loadDepositAccount();

      document.getElementById("deposit-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const amount = Number(document.getElementById("deposit-amount").value);
        const desc = document.getElementById("deposit-desc").value.trim();
        const btn = document.getElementById("btn-deposit-submit");

        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Processing Deposit...`;

        try {
          const res = await apiFetch("/transactions/deposit", {
            method: "POST",
            body: JSON.stringify({ amount, description: desc })
          });

          if (res.success && res.data) {
            showAlert("deposit-alert", `Successfully deposited ${formatCurrency(res.data.amount)}! Reference: <strong>${res.data.transactionReference}</strong>. New Balance: <strong>${formatCurrency(res.data.balanceAfterTransaction)}</strong>`, "success");
            document.getElementById("deposit-form").reset();
            await loadDepositAccount();
          }
        } catch (err) {
          showAlert("deposit-alert", err.message, "danger");
        } finally {
          btn.disabled = false;
          btn.innerHTML = `<i class="bi bi-check-circle me-1"></i> Confirm & Process Deposit`;
        }
      });
    });

    async function loadDepositAccount() {
      try {
        const res = await apiFetch("/accounts/me");
        if (res.success && res.data) {
          document.getElementById("deposit-acc-num").textContent = res.data.accountNumber;
          document.getElementById("deposit-current-balance").textContent = formatCurrency(res.data.balance);
        }
      } catch (err) {
        showAlert("deposit-alert", err.message, "danger");
      }
    }

    function setDepositAmount(val) {
      document.getElementById("deposit-amount").value = val;
    }
  </script>
</body>
</html>
